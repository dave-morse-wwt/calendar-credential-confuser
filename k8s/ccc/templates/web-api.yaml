apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-api-{{ .Release.Name }}
spec:
  replicas: {{ .Values.webApi.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      role: web-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        role: web-api
    spec:
      imagePullSecrets:
        - name: {{ .Values.externalSecret.dockerRegistry }}
      containers:
      - name: gunicorn
        image: "{{ .Values.webApi.image }}:{{ .Values.webApi.tag }}"
        imagePullPolicy: Always
        env:
        - name: OAUTHLIB_INSECURE_TRANSPORT # TODO not good for prod
          value: "1"
        - name: GOOGLE_OAUTH_JSON
          valueFrom:
            secretKeyRef:
              name: {{ .Values.externalSecret.googleOauthJson }}
              key: google-oauth-json

        - name: POSTGRES_DB_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.externalSecret.postgresDbUrl }}
              key: postgres-db-url
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.externalSecret.jwtSecretKey }}
              key: jwt-secret-key
        - name: COOKIE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.externalSecret.cookieSecretKey }}
              key: cookie-secret-key
---
# k create svc clusterip --dry-run=client -o yaml web-api-dev --tcp=8000:8000
apiVersion: v1
kind: Service
metadata:
  name: clip-web-api-{{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
  - name: http
    port: {{ .Values.webApi.clusterIP.port }}
    protocol: TCP
    targetPort: 8000
  selector:
    app: {{ .Release.Name }}
    role: web-api
---
apiVersion: v1
kind: Service
metadata:
  name: loba-web-api-{{ .Release.Name }}
spec:
  type: LoadBalancer
  ports:
  - port: {{ .Values.webApi.loadBalancer.port }}
    protocol: TCP
    targetPort: 8000
  selector:
    app: {{ .Release.Name }}
    role: web-api
  